<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Стили для оформления */
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #000000;
        }

        .table-container {
            overflow-x: auto; /* Добавляет прокрутку на мобильных */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse; /* Убирает двойные границы */
            background-color: #fff;
            min-width: 400px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        /* Оформление шапки */
        thead tr {
            background-color: #009879;
            color: #ffffff;
            text-align: left;
            font-weight: bold;
        }

        /* Эффект "зебры" для строк */
        tbody tr:nth-of-type(even) {
            background-color: #f3f3f3;
        }

        /* Подсветка строки при наведении */
        tbody tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
        }

        /* Стили для последней строки (закругление низа) */
        tbody tr:last-of-type {
            border-bottom: 2px solid #009879;
        }
    </style>
</head>
<body>

    <div id="main_table" class="table-container">
        <table>
            <thead>
                <tr>
		    <th width="70%">Информация на 29.10.2026 10:42</th>
                    <th>Заказов</th>
                    <th>Пог.метров</th>
                </tr>
            </thead>
            <tbody>

                <tr style="background-color: rgb(255,255,255);">
                    <td><span style="font-size: xx-large;">Все заказы этикетки</span>
			</br>
			
		    </td>
                    <td><span style="font-size: xx-large;">8</span></td>
                    <td><span style="font-size: xx-large;">268</span></td>
                </tr>


                <tr style="background-color: rgb(255,255,255);">
                    <td><span style="font-size: xx-large;">Голографическое серебро</span>
			</br>
			
		    </td>
                    <td><span style="font-size: xx-large;">1</span></td>
                    <td><span style="font-size: xx-large;">16</span></td>
                </tr>


                <tr style="background-color: rgb(255,255,255);">
                    <td><span style="font-size: xx-large;">Полимерная белая</span>
			</br>
			
		    </td>
                    <td><span style="font-size: xx-large;">6</span></td>
                    <td><span style="font-size: xx-large;">154</span></td>
                </tr>


                <tr style="background-color: rgb(255,255,255);">
                    <td><span style="font-size: xx-large;">Прозрачный хрусталь</span>
			</br>
			
		    </td>
                    <td><span style="font-size: xx-large;">1</span></td>
                    <td><span style="font-size: xx-large;">98</span></td>
                </tr>


                <tr style="background-color: rgb(255,255,255);">
                    <td><span style="font-size: xx-large;">Ананас</span>
			</br>
			
		    </td>
                    <td><span style="font-size: xx-large;">1</span></td>
                    <td><span style="font-size: xx-large;">16</span></td>
                </tr>


            </tbody>
        </table>
    </div>
<script>
async function checkServerTime() {
    try {
        // Получаем время с сервера
        const response = await fetch('https://zkoridor.ru/spm/api/v2/serverTime.php');
        
        if (!response.ok) throw new Error('Сеть не ответила');

        const serverTimeText = await response.text();
        const serverTime = Number(serverTimeText); // Превращаем строку в число

        // Сравниваем (PHP time() возвращает СЕКУНДЫ (не миллисекунды, например сейчас 2026-04-22,08:48 значение - 1776836855), убедитесь, что 1234567890 — это тоже секунды)
        if (serverTime > 1793263342.076) {
            document.body.style.backgroundColor = 'red';
            const table = document.getElementById('main_table');
            if (table) table.hidden = true;

           // Этот код показывает текст белым цветом на красном фоне
            document.body.style.backgroundColor = 'red';
            if (table) table.hidden = true;
            const message = document.createElement('div');
            message.innerHTML = 'Время устарело!<br>Обратись к Администратору.';
            message.style.color = '#ffffff';
            message.style.fontSize = '64px';
            message.style.fontWeight = 'bold';
            message.style.textAlign = 'center';
            message.style.marginTop = '20vh';
            document.body.appendChild(message);



        } else {
            // Если условие не выполнено, запускаем таймер перезагрузки
            setInterval(function() {
                location.reload();
            }, 600000); 
        }
    } catch (error) {
        console.error('Не удалось получить точное время:', error);
        // Резервный вариант: если сервер упал, можно либо ничего не делать, 
        // либо использовать локальное Date.now() / 1000

        
        // Этот код показывает текст белым цветом на красном фоне
        document.body.style.backgroundColor = 'red';
        const table = document.getElementById('main_table');
        if (table) table.hidden = true;
        const message = document.createElement('div');
        message.innerHTML = 'Не удалось получить точное время.<br>Обратись к Администратору.';
        message.style.color = '#ffffff';
        message.style.fontSize = '64px';
        message.style.fontWeight = 'bold';
        message.style.textAlign = 'center';
        message.style.marginTop = '20vh';
        document.body.appendChild(message);
        

    }

    // Если нужно будет в каком-то из условий вернуть цвет фона на белый:
    //document.body.style.backgroundColor = 'white';

}

checkServerTime();
</script>

</body>
</html>
